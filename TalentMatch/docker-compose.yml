version: '3.9'

services:
  qdrant:
    image: qdrant/qdrant
    container_name: talentmatch_qdrant
    restart: always
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
