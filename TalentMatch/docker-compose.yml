      QDRANT_URL: http://qdrant:6333
      SECRET_KEY: "django-insecure-u=qygnh3ne%9)$8)*lz^b#b91*^n**mmm8x#!q1p7bv8lchs$@"
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    volumes:
      - .:/app

volumes:
  qdrant_data:
