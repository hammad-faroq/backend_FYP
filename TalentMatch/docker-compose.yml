version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: talentmatch_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: talentmatch
      MYSQL_USER: django
      MYSQL_PASSWORD: django123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  qdrant:
    image: qdrant/qdrant
    container_name: talentmatch_qdrant
    restart: always
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  web:
    build: .
    container_name: talentmatch_web
    command: /app/entrypoint.sh
    environment:
      DB_HOST: db
      DB_NAME: talentmatch
      DB_USER: django
      DB_PASSWORD: django123
      QDRANT_URL: http://qdrant:6333
      SECRET_KEY: "django-insecure-u=qygnh3ne%9)$8)*lz^b#b91*^n**mmm8x#!q1p7bv8lchs$@"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - qdrant
    volumes:
      - .:/app

volumes:
  db_data:
  qdrant_data:
